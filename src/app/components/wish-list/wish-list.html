<div class="container">
  @for (movie of movieService.wishList(); track movie.id) {
    <div class="movie-card">
      <img
        [src]="`https://image.tmdb.org/t/p/w342${movie.poster_path}`"
        [alt]="movie.title"
        loading="lazy"
      />
      <div class="movie-detail">
        <h2>{{ movie.title }}</h2>
      </div>
    </div>
  } @empty {
    <p>Votre wishlist est vide.</p>
  }
</div>
